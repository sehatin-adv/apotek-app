<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Apotek App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script type="importmap">
        {
            "imports": {
                "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
            }
        }
    </script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:#0f1e2e; display:flex; justify-content:center; align-items:center; min-height:100vh; }
        .login-container { background:white; border-radius:24px; padding:48px 40px; max-width:420px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
        .brand { text-align:center; margin-bottom:32px; }
        .brand i { font-size:48px; color:#2d6a9f; }
        .brand h1 { font-size:28px; color:#0f1e2e; margin-top:8px; }
        .brand p { color:#7a8a9e; font-size:14px; }
        .form-group { margin-bottom:16px; }
        .form-group label { display:block; font-weight:600; font-size:13px; color:#34495e; margin-bottom:4px; }
        .form-group input { width:100%; padding:12px 16px; border:2px solid #e8edf3; border-radius:12px; font-size:15px; transition:0.2s; }
        .form-group input:focus { border-color:#2d6a9f; outline:none; }
        .btn-login { width:100%; padding:14px; background:#2d6a9f; color:white; border:none; border-radius:12px; font-size:16px; font-weight:700; cursor:pointer; transition:0.2s; }
        .btn-login:hover { background:#1a4a7a; }
        .btn-login:disabled { opacity:0.6; cursor:not-allowed; }
        .error { color:#dc3545; font-size:13px; text-align:center; margin-top:12px; display:none; }
        .loading { display:none; text-align:center; margin-top:8px; }
        .loading i { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .support-info { margin-top:24px; padding-top:16px; border-top:1px solid #e8edf3; font-size:12px; color:#7a8a9e; text-align:center; }
        .support-info strong { color:#0f1e2e; }
        .register-link { text-align:center; margin-top:12px; font-size:13px; }
        .register-link a { color:#2d6a9f; text-decoration:none; font-weight:600; cursor:pointer; }
        #registerForm { display:none; }
        #loginForm { display:block; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="brand">
            <i class="fas fa-prescription-bottle"></i>
            <h1>Mendidoha Farma</h1>
            <p>Apotek Management System</p>
        </div>
        <div id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="admin@apotek.com" value="admin@apotek.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Password" value="admin123">
            </div>
            <button class="btn-login" onclick="login()"><i class="fas fa-sign-in-alt"></i> Masuk</button>
            <div id="loginError" class="error"></div>
            <div class="loading" id="loadingIndicator"><i class="fas fa-spinner"></i> Memproses...</div>
        </div>
        <div class="register-link">
            Belum punya akun? <a onclick="showRegister()">Daftar Sekarang</a>
        </div>
        <div id="registerForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="regEmail" placeholder="email@domain.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPassword" placeholder="Minimal 6 karakter">
            </div>
            <div class="form-group">
                <label>Nama</label>
                <input type="text" id="regName" placeholder="Nama lengkap">
            </div>
            <button class="btn-login" onclick="register()"><i class="fas fa-user-plus"></i> Daftar</button>
            <div id="registerError" class="error"></div>
            <div style="text-align:center;margin-top:12px;">
                <a onclick="showLogin()" style="color:#2d6a9f;cursor:pointer;">Kembali ke Login</a>
            </div>
        </div>
        <div class="support-info">
            <strong>NOMOR SUPPORT VMEDIS BERGANTI</strong><br>
            Member Support Team: <strong>085101973000</strong>
        </div>
    </div>
    
    <script type="module">
        import { supabase, signIn, signUp } from './supabase.js';
        
        window.login = async function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.querySelector('#loginForm .btn-login');
            const errorEl = document.getElementById('loginError');
            const loading = document.getElementById('loadingIndicator');
            
            if (!email || !password) {
                errorEl.textContent = '❌ Email dan password wajib diisi!';
                errorEl.style.display = 'block';
                return;
            }
            
            btn.disabled = true;
            loading.style.display = 'block';
            errorEl.style.display = 'none';
            
            const { data, error } = await signIn(email, password);
            
            btn.disabled = false;
            loading.style.display = 'none';
            
            if (error) {
                errorEl.textContent = '❌ ' + error.message;
                errorEl.style.display = 'block';
            } else {
                localStorage.setItem('supabaseSession', JSON.stringify(data.session));
                window.location.href = '/dashboard.html';
            }
        };
        
        window.register = async function() {
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const name = document.getElementById('regName').value;
            const errorEl = document.getElementById('registerError');
            const btn = document.querySelector('#registerForm .btn-login');
            
            if (!email || !password || !name) {
                errorEl.textContent = '❌ Semua field wajib diisi!';
                errorEl.style.display = 'block';
                return;
            }
            
            if (password.length < 6) {
                errorEl.textContent = '❌ Password minimal 6 karakter!';
                errorEl.style.display = 'block';
                return;
            }
            
            btn.disabled = true;
            errorEl.style.display = 'none';
            
            const { data, error } = await signUp(email, password, { full_name: name });
            
            btn.disabled = false;
            
            if (error) {
                errorEl.textContent = '❌ ' + error.message;
                errorEl.style.display = 'block';
            } else {
                alert('✅ Pendaftaran berhasil! Silakan login.');
                showLogin();
            }
        };
        
        window.showRegister = function() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
        };
        
        window.showLogin = function() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
        };
        
        // Cek session
        const session = localStorage.getItem('supabaseSession');
        if (session) {
            try {
                const sessionData = JSON.parse(session);
                if (sessionData && sessionData.expires_at > Date.now() / 1000) {
                    window.location.href = '/dashboard.html';
                }
            } catch(e) {}
        }
        
        document.addEventListener('keydown', e => { if(e.key === 'Enter') window.login(); });
    </script>
</body>
</html>
