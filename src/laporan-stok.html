<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Stok - Apotek Mendidoha Farma</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',sans-serif; background:#f0f2f7; }
.app-layout { display:flex; min-height:100vh; }
.sidebar { width:250px; background:#0f1e2e; color:white; padding:20px 0; position:fixed; height:100vh; overflow-y:auto; }
.logo { padding:0 24px 20px; font-size:20px; font-weight:800; border-bottom:1px solid rgba(255,255,255,0.06); }
.logo i { color:#4fc3f7; margin-right:10px; }
.menu-item { padding:10px 24px; display:flex; align-items:center; gap:14px; cursor:pointer; color:rgba(255,255,255,0.6); font-size:14px; font-weight:500; border-left:3px solid transparent; transition:0.15s; }
.menu-item:hover { background:rgba(255,255,255,0.05); color:white; }
.menu-item.active { background:rgba(255,255,255,0.08); color:white; border-left-color:#4fc3f7; }
.menu-item i { width:20px; text-align:center; }
.user-info { padding:16px 24px; border-top:1px solid rgba(255,255,255,0.06); margin-top:20px; font-size:13px; color:rgba(255,255,255,0.5); position:absolute; bottom:0; width:100%; }
.user-info strong { color:white; }
.btn-logout { background:rgba(255,255,255,0.1); color:white; border:none; padding:6px 16px; border-radius:8px; cursor:pointer; margin-top:8px; font-size:12px; }
.main-content { margin-left:250px; flex:1; padding:24px 32px; min-height:100vh; }
.header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
.header h2 { font-size:22px; color:#0f1e2e; }
.card { background:white; border-radius:16px; padding:20px 24px; box-shadow:0 2px 8px rgba(0,0,0,0.04); margin-bottom:20px; }
.card-title { font-size:16px; font-weight:700; color:#0f1e2e; margin-bottom:16px; }
.btn { padding:8px 18px; border:none; border-radius:10px; font-weight:600; font-size:13px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:0.15s; }
.btn-primary { background:#2d6a9f; color:white; }
.btn-success { background:#28a745; color:white; }
.btn-danger { background:#dc3545; color:white; }
.btn-outline { background:transparent; border:2px solid #e8edf3; }
.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:14px; }
table th { text-align:left; padding:12px; background:#f8fafc; font-weight:600; border-bottom:2px solid #e8edf3; }
table td { padding:10px 12px; border-bottom:1px solid #eef2f7; }
.badge { display:inline-block; padding:4px 12px; border-radius:30px; font-size:11px; font-weight:600; }
.badge-success { background:#d4edda; color:#155724; }
.badge-danger { background:#f8d7da; color:#721c24; }
.flex-between { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
.form-group { margin-bottom:14px; }
.form-group label { font-weight:600; font-size:13px; color:#34495e; display:block; margin-bottom:4px; }
.form-group input, .form-group select { width:100%; padding:10px 14px; border:2px solid #e8edf3; border-radius:10px; font-size:14px; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:999; justify-content:center; align-items:center; }
.modal-overlay.active { display:flex; }
.modal-box { background:white; border-radius:20px; padding:32px; max-width:600px; width:100%; max-height:90vh; overflow-y:auto; }
.modal-close { float:right; background:none; border:none; font-size:24px; cursor:pointer; color:#7a8a9e; }
@media (max-width:768px) { .sidebar { width:100%; position:static; height:auto; } .main-content { margin-left:0; padding:16px; } .form-row { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="app-layout">
    <div class="sidebar">
        <div class="logo"><i class="fas fa-prescription-bottle"></i>Mendidoha Farma</div>
        <div class="menu-item" onclick="navigate('dashboard.html')"><i class="fas fa-th-large"></i> Dashboard</div>
        <div class="menu-item active"><i class="fas fa-box"></i> Laporan Stok</div>
        <div class="menu-item" onclick="navigate('pembelian.html')"><i class="fas fa-shopping-cart"></i> Pembelian</div>
        <div class="menu-item" onclick="navigate('stok-terkini.html')"><i class="fas fa-boxes"></i> Stok</div>
        <div class="menu-item" onclick="navigate('penjualan.html')"><i class="fas fa-cash-register"></i> Penjualan</div>
        <div class="menu-item" onclick="navigate('laporan-harian.html')"><i class="fas fa-file-alt"></i> Laporan</div>
        <div class="user-info">
            <i class="fas fa-user-circle"></i> <strong>admin</strong><br>
            <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </div>
    <div class="main-content">
        <div class="header">
            <h2><i class="fas fa-box"></i> Laporan Stok</h2>
            <div class="user-badge" style="background:white;padding:8px 18px;border-radius:30px;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,0.04);">
                <i class="fas fa-user-circle"></i> admin
            </div>
        </div>
        <div class="card">
            <div class="flex-between">
                <div class="card-title">Data Laporan Stok</div>
                <div><button class="btn btn-primary" onclick="alert('Fitur tambah data')"><i class="fas fa-plus"></i> Tambah</button></div>
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>No</th><th>Kode</th><th>Nama</th><th>Status</th><th>Aksi</th></tr></thead>
                    <tbody id="tableBody"><tr><td colspan="5" style="text-align:center;color:#7a8a9e;">Loading data...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script>
    function navigate(page) { window.location.href = page; }
    function logout() { localStorage.removeItem('loggedIn'); window.location.href = '/'; }
    if (!localStorage.getItem('loggedIn')) window.location.href = '/';
    
    // Load data
    async function loadData() {
        try {
            const res = await fetch('/api/laporan-stok');
            const data = await res.json();
            const tbody = document.getElementById('tableBody');
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#7a8a9e;">Belum ada data</td></tr>';
            } else {
                tbody.innerHTML = data.map((d,i) => `
                    <tr><td>${i+1}</td><td>${d.kode || d.kode_obat || '-'}</td><td>${d.nama || d.nama_obat || d.nama_supplier || '-'}</td>
                    <td><span class="badge badge-success">${d.status || 'Aktif'}</span></td>
                    <td><button class="btn btn-primary btn-sm" style="padding:4px 12px;font-size:12px;"><i class="fas fa-edit"></i></button></td></tr>
                `).join('');
            }
        } catch(e) { console.log('Error loading data'); }
    }
    loadData();
</script>
</body>
</html>
