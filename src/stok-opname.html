<script type="module">
    import { supabase } from './supabase.js';
    import { getObat, getStokOpname, saveStokOpname } from './database.js';

    // ============================================================
    // AUTH CHECK
    // ============================================================
    async function checkAuth() {
        const session = localStorage.getItem('supabaseSession');
        if (!session) {
            window.location.href = '/';
            return false;
        }
        try {
            const { data, error } = await supabase.auth.getSession();
            if (error || !data?.session) {
                localStorage.removeItem('supabaseSession');
                window.location.href = '/';
                return false;
            }
            return true;
        } catch(e) {
            localStorage.removeItem('supabaseSession');
            window.location.href = '/';
            return false;
        }
    }

    if (!await checkAuth()) {
        window.location.href = '/';
    }

    // ============================================================
    // NAVIGATION
    // ============================================================
    window.navigate = function(page) { window.location.href = page; };
    window.logout = function() { localStorage.removeItem('supabaseSession'); window.location.href = '/'; };

    window.toggleDropdown = function(el) {
        const subMenu = el.parentElement.querySelector('.sub-menu');
        const chevron = el.querySelector('.chevron');
        if (subMenu) {
            subMenu.classList.toggle('open');
            if (chevron) chevron.classList.toggle('open');
        }
    };

    // ============================================================
    // GLOBAL
    // ============================================================
    let sessionData = null;
    let opnameItems = [];
    let obatMaster = [];
    let detailOpnameData = null;
    let riwayatDataCache = [];

    // ============================================================
    // LOAD MASTER OBAT
    // ============================================================
    async function loadMasterObat() {
        try {
            const { data, error } = await getObat();
            if (data && data.length > 0) {
                obatMaster = data;
            } else {
                const local = localStorage.getItem('obat');
                if (local) obatMaster = JSON.parse(local);
            }
        } catch(e) {
            const local = localStorage.getItem('obat');
            if (local) obatMaster = JSON.parse(local);
        }
    }

    // ============================================================
    // MULAI STOK OPNAME
    // ============================================================
    window.mulaiOpname = async function() {
        const existing = localStorage.getItem('opname_session_active');
        if (existing) {
            showToast('⚠️ Masih ada sesi opname yang aktif!', true);
            return;
        }
        await loadMasterObat();
        if (!obatMaster || obatMaster.length === 0) {
            showToast('⚠️ Belum ada data obat!', true);
            return;
        }
        if (!confirm('Mulai stok opname? Sistem akan mengambil snapshot stok saat ini.')) return;
        const now = new Date();
        const timestamp = now.toISOString();
        const snapshot = obatMaster.map(o => ({
            id: o.id, kode_obat: o.kode_obat, nama_obat: o.nama_obat,
            satuan: o.satuan || 'Tablet', snapshot_stok: Number(o.stok) || 0
        }));
        sessionData = {
            id: 'SO-' + new Date().toISOString().split('T')[0].replace(/-/g, '') + '-' + String(Date.now()).slice(-4),
            tanggal_mulai: timestamp,
            status: 'berlangsung',
            snapshot: snapshot
        };
        localStorage.setItem('opname_session_active', JSON.stringify(sessionData));
        opnameItems = snapshot.map(s => ({ ...s, stok_fisik: 0, stok_sistem: s.snapshot_stok, selisih: 0, status: 'Belum diinput' }));
        renderUI();
        showToast('✅ Stok opname dimulai! Snapshot telah diambil.');
    };

    // ============================================================
    // RENDER UI
    // ============================================================
    function renderUI() {
        const active = localStorage.getItem('opname_session_active');
        if (active) {
            sessionData = JSON.parse(active);
            document.getElementById('sessionCard').style.display = 'block';
            document.getElementById('mulaiCard').style.display = 'none';
            document.getElementById('inputCard').style.display = 'block';
            document.getElementById('sessionStart').textContent = new Date(sessionData.tanggal_mulai).toLocaleString();
            document.getElementById('sessionTotalItem').textContent = sessionData.snapshot.length;
            if (opnameItems.length === 0) {
                opnameItems = sessionData.snapshot.map(s => ({ ...s, stok_fisik: 0, stok_sistem: s.snapshot_stok, selisih: 0, status: 'Belum diinput' }));
            }
            const saved = localStorage.getItem('opname_progress_' + sessionData.id);
            if (saved) {
                const savedData = JSON.parse(saved);
                savedData.forEach(savedItem => {
                    const idx = opnameItems.findIndex(item => item.id === savedItem.id);
                    if (idx !== -1) {
                        opnameItems[idx].stok_fisik = savedItem.stok_fisik || 0;
                        opnameItems[idx].selisih = opnameItems[idx].stok_fisik - opnameItems[idx].stok_sistem;
                        opnameItems[idx].status = opnameItems[idx].selisih === 0 ? 'Aman' : (opnameItems[idx].selisih > 0 ? 'Lebih' : 'Kurang');
                    }
                });
            }
            renderOpnameTable(opnameItems);
            document.getElementById('totalItemOpname').textContent = opnameItems.length + ' item';
            const filled = opnameItems.filter(i => i.stok_fisik > 0 || i.stok_fisik === 0 && i.status !== 'Belum diinput').length;
            document.getElementById('sessionProgress').textContent = filled + '/' + opnameItems.length;
        } else {
            document.getElementById('sessionCard').style.display = 'none';
            document.getElementById('mulaiCard').style.display = 'block';
            document.getElementById('inputCard').style.display = 'none';
            opnameItems = [];
        }
        loadRiwayat();
    }

    // ============================================================
    // RENDER TABEL OPNAME
    // ============================================================
    function renderOpnameTable(data) {
        const tbody = document.getElementById('opnameTableBody');
        const tfoot = document.getElementById('opnameTableFoot');
        if (!data || data.length === 0) { tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#7a8a9e;padding:30px;">Belum ada data</td></tr>'; tfoot.style.display = 'none'; return; }
        let totalFisik = 0, totalSelisih = 0, jumlahSelisih = 0;
        tbody.innerHTML = data.map((item, index) => {
            const selisih = item.selisih || 0;
            totalFisik += item.stok_fisik || 0; totalSelisih += selisih; if (selisih !== 0) jumlahSelisih++;
            let statusClass = 'badge-info', statusText = 'Belum';
            if (item.stok_fisik > 0 || item.stok_fisik === 0 && item.status !== 'Belum diinput') {
                if (selisih === 0) { statusClass = 'badge-success'; statusText = 'Aman'; }
                else if (selisih > 0) { statusClass = 'badge-warning'; statusText = 'Lebih +' + selisih; }
                else { statusClass = 'badge-danger'; statusText = 'Kurang ' + selisih; }
            }
            return `<tr><td>${index+1}</td><td><strong>${item.kode_obat||'-'}</strong></td><td>${item.nama_obat||'-'}</td><td>${item.satuan||'-'}</td><td style="text-align:right;">${item.snapshot_stok}</td><td style="text-align:right;font-weight:600;">${item.stok_sistem}</td><td><input type="number" class="stok-fisik-input" data-index="${index}" value="${item.stok_fisik||0}" min="0" step="any" oninput="updateStokFisik(${index}, this.value)" onblur="updateStokFisik(${index}, this.value)"></td><td style="text-align:right;font-weight:700;color:${selisih===0?'#28a745':'#dc3545'};">${selisih!==0?selisih:'-'}</td><td><span class="badge ${statusClass}">${statusText}</span></td></tr>`;
        }).join('');
        document.getElementById('totalFisik').textContent = totalFisik;
        document.getElementById('totalSelisih').textContent = totalSelisih;
        document.getElementById('footerTotalSelisih').textContent = totalSelisih;
        document.getElementById('footerJumlahSelisih').textContent = jumlahSelisih;
        tfoot.style.display = 'table-footer-group';
    }

    // ============================================================
    // UPDATE STOK FISIK
    // ============================================================
    window.updateStokFisik = function(index, value) {
        if (index < 0 || index >= opnameItems.length) return;
        const stokFisik = Number(value) || 0;
        const item = opnameItems[index];
        item.stok_fisik = stokFisik;
        item.selisih = stokFisik - item.stok_sistem;
        item.status = item.selisih === 0 ? 'Aman' : (item.selisih > 0 ? 'Lebih' : 'Kurang');
        const row = document.querySelector(`#opnameTableBody tr:nth-child(${index+1})`);
        if (row) {
            const cells = row.querySelectorAll('td');
            if (cells.length >= 9) {
                cells[7].textContent = item.selisih !== 0 ? item.selisih : '-';
                cells[7].style.color = item.selisih === 0 ? '#28a745' : '#dc3545';
                let statusClass = 'badge-info', statusText = 'Belum';
                if (item.stok_fisik > 0 || item.stok_fisik === 0 && item.status !== 'Belum diinput') {
                    if (item.selisih === 0) { statusClass = 'badge-success'; statusText = 'Aman'; }
                    else if (item.selisih > 0) { statusClass = 'badge-warning'; statusText = 'Lebih +' + item.selisih; }
                    else { statusClass = 'badge-danger'; statusText = 'Kurang ' + item.selisih; }
                }
                cells[8].innerHTML = `<span class="badge ${statusClass}">${statusText}</span>`;
            }
        }
        updateTotalOpname();
        const filled = opnameItems.filter(i => i.stok_fisik > 0 || i.stok_fisik === 0 && i.status !== 'Belum diinput').length;
        document.getElementById('sessionProgress').textContent = filled + '/' + opnameItems.length;
        simpanProgress();
    };

    function updateTotalOpname() {
        let totalFisik = 0, totalSelisih = 0, jumlahSelisih = 0;
        opnameItems.forEach(item => {
            totalFisik += item.stok_fisik || 0;
            totalSelisih += item.selisih || 0;
            if (item.selisih !== 0) jumlahSelisih++;
        });
        document.getElementById('totalFisik').textContent = totalFisik;
        document.getElementById('totalSelisih').textContent = totalSelisih;
        document.getElementById('footerTotalSelisih').textContent = totalSelisih;
        document.getElementById('footerJumlahSelisih').textContent = jumlahSelisih;
    }

    window.filterOpname = function() {
        const keyword = document.getElementById('searchOpname').value.toLowerCase();
        const filter = document.getElementById('filterOpname').value;
        let filtered = opnameItems;
        if (keyword) filtered = filtered.filter(o => (o.kode_obat||'').toLowerCase().includes(keyword) || (o.nama_obat||'').toLowerCase().includes(keyword));
        if (filter === 'selisih') filtered = filtered.filter(o => o.selisih !== 0);
        else if (filter === 'aman') filtered = filtered.filter(o => o.selisih === 0);
        renderOpnameTable(filtered);
    };

    window.simpanProgress = function() {
        if (!sessionData) return;
        localStorage.setItem('opname_progress_' + sessionData.id, JSON.stringify(opnameItems));
    };

    window.batalOpname = function() {
        if (!confirm('Batalkan stok opname? Semua data yang sudah diinput akan hilang.')) return;
        localStorage.removeItem('opname_session_active');
        if (sessionData) localStorage.removeItem('opname_progress_' + sessionData.id);
        sessionData = null; opnameItems = [];
        renderUI();
        showToast('🔄 Stok opname dibatalkan');
    };

    // ============================================================
// SELESAI OPNAME - FINAL FIX
// ============================================================
window.selesaiOpname = async function() {
    if (!sessionData) {
        showToast('⚠️ Tidak ada sesi opname yang aktif!', true);
        return;
    }
    
    const unfilled = opnameItems.filter(i => i.stok_fisik === 0);
    if (unfilled.length > 0 && !confirm(`Masih ada ${unfilled.length} item yang belum diinput stok fisiknya. Lanjutkan?`)) {
        return;
    }
    
    // Hitung total selisih
    let totalSelisih = 0;
    opnameItems.forEach(item => {
        totalSelisih += (item.selisih || 0);
    });
    
    const now = new Date();
    const tanggal = now.toISOString().split('T')[0];
    const jam = now.toTimeString().slice(0, 5);
    
    // ============================================================
    // FORMAT DATA UNTUK SAVE STOK OPNAME
    // ============================================================
    const record = {
        sesi_id: sessionData.id,
        items: opnameItems.map(item => ({
            id: item.id,
            kode_obat: item.kode_obat || '',
            nama_obat: item.nama_obat || '',
            satuan: item.satuan || 'Tablet',
            snapshot_stok: item.snapshot_stok || 0,
            stok_sistem: item.stok_sistem || 0,
            stok_fisik: item.stok_fisik || 0,
            selisih: item.selisih || 0
        })),
        total_selisih: totalSelisih,
        jumlah_item: opnameItems.length,
        tanggal_selesai: now.toISOString(),
        keterangan: 'Stok Opname selesai'
    };
    
    console.log('📦 Data yang akan disimpan:', record);
    
    // ============================================================
    // SIMPAN KE SUPABASE
    // ============================================================
    const { data, error } = await saveStokOpname(record);
    
    if (error) {
        console.error('❌ Error saveStokOpname:', error);
        showToast('⚠️ Gagal menyimpan: ' + error.message, true);
        
        // Fallback: simpan ke localStorage
        const history = JSON.parse(localStorage.getItem('opname_history') || '[]');
        history.push({
            id: sessionData.id,
            tanggal_mulai: sessionData.tanggal_mulai,
            tanggal_selesai: now.toISOString(),
            total_selisih: totalSelisih,
            jumlah_item: opnameItems.length,
            items: JSON.parse(JSON.stringify(opnameItems)),
            status: 'Selesai'
        });
        localStorage.setItem('opname_history', JSON.stringify(history));
        
        // Update stok lokal
        const obatLocal = JSON.parse(localStorage.getItem('obat') || '[]');
        opnameItems.forEach(item => {
            const obat = obatLocal.find(o => o.id === item.id);
            if (obat) {
                obat.stok = (Number(obat.stok) || 0) + (item.selisih || 0);
                if (obat.stok < 0) obat.stok = 0;
            }
        });
        localStorage.setItem('obat', JSON.stringify(obatLocal));
        showToast('✅ Stok opname selesai (disimpan offline)!');
    } else {
        console.log('✅ Stok opname berhasil disimpan:', data);
        showToast('✅ Stok opname selesai! Data tersimpan di database.');
    }
    
    // Bersihkan session
    localStorage.removeItem('opname_session_active');
    localStorage.removeItem('opname_progress_' + sessionData.id);
    sessionData = null;
    opnameItems = [];
    renderUI();
};

    // ============================================================
    // LOAD RIWAYAT OPNAME - DIPERBAIKI
    // ============================================================
    async function loadRiwayat() {
        const { data, error } = await getStokOpname();
        let history = (data && data.length > 0) ? data : JSON.parse(localStorage.getItem('opname_history') || '[]');
        riwayatDataCache = history;
        const tbody = document.getElementById('riwayatBody');
        if (!history || history.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#7a8a9e;padding:30px;">Belum ada riwayat opname</td></tr>';
            return;
        }
        tbody.innerHTML = history.slice(-10).reverse().map((h, i) => `
            <tr>
                <td>${i+1}</td>
                <td>${h.tanggal_mulai ? new Date(h.tanggal_mulai).toLocaleDateString() : '-'}</td>
                <td>${h.tanggal_selesai ? new Date(h.tanggal_selesai).toLocaleDateString() : '-'}</td>
                <td style="font-weight:700;color:${h.total_selisih===0?'#28a745':'#dc3545'};">${h.total_selisih}</td>
                <td>${h.jumlah_item}</td>
                <td><span class="badge badge-success">${h.status || 'Selesai'}</span></td>
                <td><button class="btn btn-primary btn-sm" onclick="lihatDetailOpname('${h.id}')"><i class="fas fa-eye"></i> Detail</button></td>
            </tr>
        `).join('');
    }

    window.lihatDetailOpname = function(id) {
        const localHistory = JSON.parse(localStorage.getItem('opname_history') || '[]');
        const record = riwayatDataCache.find(h => h.id === id) || localHistory.find(h => h.id === id);
        if (!record) { showToast('Data tidak ditemukan', true); return; }
        detailOpnameData = record;
        document.getElementById('detailTitle').textContent = 'Detail Stok Opname - ' + record.id;
        const content = document.getElementById('detailContent');
        if (record.items && record.items.length > 0) {
            let html = `<div style="margin-bottom:8px;display:flex;gap:20px;flex-wrap:wrap;"><span><strong>Tanggal Mulai:</strong> ${new Date(record.tanggal_mulai).toLocaleString()}</span>
            <span><strong>Tanggal Selesai:</strong> ${record.tanggal_selesai ? new Date(record.tanggal_selesai).toLocaleString() : '-'}</span>
            <span><strong>Total Selisih:</strong> <span style="color:${record.total_selisih===0?'#28a745':'#dc3545'};font-weight:700;">${record.total_selisih}</span></span></div>
            <div class="table-wrap"><table><thead><tr><th>No</th><th>Kode</th><th>Nama Obat</th><th>Satuan</th><th>Snapshot</th><th>Stok Sistem</th><th>Stok Fisik</th><th>Selisih</th></tr></thead><tbody>`;
            record.items.forEach((item, idx) => {
                const selisih = item.selisih || 0;
                html += `<tr><td>${idx+1}</td><td>${item.kode_obat||'-'}</td><td>${item.nama_obat||'-'}</td><td>${item.satuan||'-'}</td><td style="text-align:right;">${item.snapshot_stok}</td><td style="text-align:right;font-weight:600;">${item.stok_sistem}</td><td style="text-align:right;">${item.stok_fisik||0}</td><td style="text-align:right;font-weight:700;color:${selisih===0?'#28a745':'#dc3545'};">${selisih}</td></tr>`;
            });
            html += `</tbody><tfoot><tr class="total-row"><td colspan="6" style="text-align:right;">TOTAL</td><td style="text-align:right;font-weight:700;">${record.items.reduce((sum,i)=>sum+(i.stok_fisik||0),0)}</td><td style="text-align:right;font-weight:700;color:${record.total_selisih===0?'#28a745':'#dc3545'};">${record.total_selisih}</td></tr></tfoot></table></div>`;
            content.innerHTML = html;
        } else { content.innerHTML = '<p>Tidak ada data item.</p>'; }
        document.getElementById('modalDetailOpname').classList.add('active');
    };

    window.closeDetailModal = function() {
        document.getElementById('modalDetailOpname').classList.remove('active');
        detailOpnameData = null;
    };

    window.cetakDetail = function() {
        if (!detailOpnameData) { showToast('Tidak ada data untuk dicetak', true); return; }
        const record = detailOpnameData;
        let html = `<html><head><title>Detail Stok Opname</title><style>body{font-family:Arial,sans-serif;padding:20px;}h1{text-align:center;color:#0f1e2e;border-bottom:2px solid #2d6a9f;padding-bottom:10px;}table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px;}table th{background:#f0f2f7;padding:8px;border:1px solid #d0d7de;text-align:left;}table td{padding:6px;border:1px solid #d0d7de;}.right{text-align:right;}.total-row{font-weight:700;background:#f8fafc;}.footer{text-align:center;margin-top:20px;font-size:12px;color:#7a8a9e;border-top:1px solid #d0d7de;padding-top:12px;}</style></head><body>
        <h1>DETAIL STOK OPNAME</h1><div style="display:flex;gap:30px;margin:16px 0;"><div><strong>ID:</strong> ${record.id}</div><div><strong>Tanggal Mulai:</strong> ${new Date(record.tanggal_mulai).toLocaleString()}</div><div><strong>Total Selisih:</strong> ${record.total_selisih}</div></div>
        <table><thead><tr><th>No</th><th>Kode</th><th>Nama Obat</th><th>Satuan</th><th class="right">Snapshot</th><th class="right">Stok Sistem</th><th class="right">Stok Fisik</th><th class="right">Selisih</th></tr></thead><tbody>`;
        record.items.forEach((item, idx) => {
            const selisih = item.selisih || 0;
            html += `<tr><td>${idx+1}</td><td>${item.kode_obat||'-'}</td><td>${item.nama_obat||'-'}</td><td>${item.satuan||'-'}</td><td class="right">${item.snapshot_stok}</td><td class="right">${item.stok_sistem}</td><td class="right">${item.stok_fisik||0}</td><td class="right">${selisih}</td></tr>`;
        });
        html += `</tbody><tfoot><tr class="total-row"><td colspan="6" class="right">TOTAL</td><td class="right">${record.items.reduce((sum,i)=>sum+(i.stok_fisik||0),0)}</td><td class="right">${record.total_selisih}</td></tr></tfoot></table>
        <div class="footer">Dicetak: ${new Date().toLocaleString()} | Mendidoha Farma</div>
        <script>window.print();setTimeout(function(){window.close();},1000);<\/script></body></html>`;
        const win = window.open('', '_blank', 'width=900,height=700');
        if (win) { win.document.write(html); win.document.close(); } else { alert('⚠️ Mohon izinkan popup untuk mencetak!'); }
    };

    window.downloadOpnameCSV = function() {
        if (!opnameItems || opnameItems.length === 0) { alert('Tidak ada data untuk di-download'); return; }
        let csv = 'Kode Obat,Nama Obat,Satuan,Snapshot,Stok Sistem,Stok Fisik,Selisih,Status\n';
        opnameItems.forEach(item => { csv += `${item.kode_obat},${item.nama_obat},${item.satuan},${item.snapshot_stok},${item.stok_sistem},${item.stok_fisik},${item.selisih},${item.status}\n`; });
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Stok_Opname_${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('📥 Download berhasil');
    };

    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'toast' + (isError ? ' error' : '');
        toast.style.display = 'block';
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    document.addEventListener('DOMContentLoaded', function() {
        loadMasterObat();
        renderUI();
    });
</script>
</body>
</html>
