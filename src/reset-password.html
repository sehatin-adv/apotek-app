<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/logo-icon.png">
    <title>Reset Password - Sehatin+</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:linear-gradient(135deg,#0f1e2e,#1a3a5c); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
        .box { background:white; border-radius:20px; padding:36px 32px; max-width:400px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
        .logo { text-align:center; margin-bottom:20px; }
        .logo img { height:48px; width:48px; border-radius:10px; }
        h1 { font-size:19px; text-align:center; color:#0f1e2e; margin-bottom:6px; }
        .subtitle { font-size:13px; color:#7a8a9e; text-align:center; margin-bottom:24px; }
        .form-group { margin-bottom:16px; }
        .form-group label { display:block; font-size:13px; font-weight:600; color:#34495e; margin-bottom:5px; }
        .form-group input { width:100%; padding:11px 14px; border:2px solid #e8edf3; border-radius:10px; font-size:14px; }
        .form-group input:focus { border-color:#2d6a9f; outline:none; }
        .btn { width:100%; padding:13px; background:#2d6a9f; color:white; border:none; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; }
        .btn:hover { background:#1a4a7a; }
        .btn:disabled { opacity:0.6; cursor:not-allowed; }
        .msg { padding:10px 14px; border-radius:10px; font-size:13px; margin-bottom:14px; display:none; }
        .msg.error { background:#fbe4e6; color:#8a2020; }
        .msg.success { background:#d4edda; color:#1e7e34; }
        .success-box { text-align:center; }
        .success-box i { font-size:44px; color:#28a745; margin-bottom:14px; display:block; }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo"><img src="/logo-icon.png" alt="Sehatin+"></div>

        <div id="formSection">
            <h1>Atur Password Baru</h1>
            <p class="subtitle">Masukkan password baru untuk akun Anda</p>
            <div class="msg error" id="errorMsg"></div>
            <div class="form-group">
                <label>Password Baru</label>
                <input type="password" id="newPassword" placeholder="Minimal 6 karakter">
            </div>
            <div class="form-group">
                <label>Ulangi Password Baru</label>
                <input type="password" id="confirmPassword" placeholder="Ketik ulang password baru">
            </div>
            <button class="btn" id="btnSubmit" onclick="submitPasswordBaru()"><i class="fas fa-check"></i> Simpan Password Baru</button>
        </div>

        <div id="successSection" style="display:none;" class="success-box">
            <i class="fas fa-circle-check"></i>
            <h1>Password Berhasil Diubah!</h1>
            <p class="subtitle">Silakan login dengan password baru Anda.</p>
            <a href="/index.html" class="btn" style="display:block;text-decoration:none;text-align:center;line-height:1.2;padding-top:13px;">Ke Halaman Login</a>
        </div>

        <div id="invalidLinkSection" style="display:none;" class="success-box">
            <i class="fas fa-circle-exclamation" style="color:#dc3545;"></i>
            <h1>Link Tidak Valid atau Kedaluwarsa</h1>
            <p class="subtitle">Link reset password ini sudah tidak berlaku. Silakan minta link baru dari halaman login.</p>
            <a href="/index.html" class="btn" style="display:block;text-decoration:none;text-align:center;line-height:1.2;padding-top:13px;">Kembali ke Login</a>
        </div>
    </div>

<script type="module">
    import { supabase, updatePassword } from './supabase.js';

    let sesiPemulihanValid = false;

    // Supabase otomatis proses token dari URL (fragment #access_token=...)
    // saat halaman dimuat, lalu memicu event PASSWORD_RECOVERY kalau
    // link-nya valid. Kalau tidak ada event ini dalam beberapa detik,
    // berarti link-nya sudah tidak berlaku (kedaluwarsa/sudah dipakai).
    supabase.auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY') {
            sesiPemulihanValid = true;
        }
    });

    window.submitPasswordBaru = async function() {
        const pass1 = document.getElementById('newPassword').value;
        const pass2 = document.getElementById('confirmPassword').value;
        const errorMsg = document.getElementById('errorMsg');
        errorMsg.style.display = 'none';

        if (!pass1 || pass1.length < 6) {
            errorMsg.textContent = '❌ Password minimal 6 karakter.';
            errorMsg.style.display = 'block';
            return;
        }
        if (pass1 !== pass2) {
            errorMsg.textContent = '❌ Password dan konfirmasi tidak sama.';
            errorMsg.style.display = 'block';
            return;
        }

        const btn = document.getElementById('btnSubmit');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';

        const { error } = await updatePassword(pass1);

        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check"></i> Simpan Password Baru';

        if (error) {
            errorMsg.textContent = '❌ ' + error.message;
            errorMsg.style.display = 'block';
            return;
        }

        document.getElementById('formSection').style.display = 'none';
        document.getElementById('successSection').style.display = 'block';
    };

    // Kasih waktu sebentar buat Supabase memproses token dari URL - kalau
    // setelah itu tidak ada sesi pemulihan yang valid, tampilkan pesan
    // link tidak berlaku (daripada form kosong yang membingungkan).
    setTimeout(async () => {
        if (!sesiPemulihanValid) {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                document.getElementById('formSection').style.display = 'none';
                document.getElementById('invalidLinkSection').style.display = 'block';
            }
        }
    }, 2500);
</script>
</body>
</html>
