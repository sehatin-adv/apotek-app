# PENTING - JANGAN taruh SUPABASE_SERVICE_ROLE_KEY di file ini atau di
# mana pun yang ikut ke-commit ke git/zip. Set sebagai SECRET terpisah
# lewat salah satu cara ini:
#   1. CLI: npx wrangler pages secret put SUPABASE_SERVICE_ROLE_KEY
#   2. Dashboard: Workers & Pages > sehatin-app > Settings >
#      Environment variables > Add variable > tipe "Secret" (bukan
#      "Text"/plaintext) > name: SUPABASE_SERVICE_ROLE_KEY
# Nilainya: Supabase Dashboard > Project Settings > API > service_role key.
# Dipakai HANYA oleh functions/api/admin-auth.js di server, tidak
# pernah dikirim ke browser.

# JUGA set secret kedua ini - kunci khusus Anda sebagai pemilik
# platform, dipakai buat masuk ke halaman /platform-tenants.html
# (daftar tenant/apotek baru). Isi bebas, minimal 20 karakter acak,
# JANGAN dipakai ulang dari password lain:
#   npx wrangler pages secret put PLATFORM_ADMIN_SECRET

# OPSIONAL - Bot Telegram buat kelola tenant lewat chat (lihat
# functions/api/telegram-webhook.js buat cara pakainya):
#   npx wrangler pages secret put TELEGRAM_BOT_TOKEN
#   npx wrangler pages secret put TELEGRAM_AUTHORIZED_USER_ID

# OPSIONAL - Integrasi iPaymu (QRIS dinamis + auto-perpanjang saat
# pelanggan bayar). VA dan API Key didapat dari dashboard iPaymu >
# menu Integrasi. PAKAI YANG SANDBOX DULU buat uji coba:
#   npx wrangler pages secret put IPAYMU_VA
#   npx wrangler pages secret put IPAYMU_API_KEY
# IPAYMU_MODE boleh var biasa (bukan secret) karena bukan rahasia -
# isi "sandbox" (default kalau tidak diisi) atau "production":
#   npx wrangler pages secret put IPAYMU_MODE

# OPSIONAL - Integrasi Scan Faktur AI (Google Gemini Vision). Dapatkan
# API key gratis dari aistudio.google.com/apikey:
#   npx wrangler pages secret put GEMINI_API_KEY

# OPSIONAL - Integrasi Xendit (QRIS dinamis untuk langganan Basic/Pro +
# upgrade). Secret Key didapat dari dashboard Xendit > Konfigurasi >
# Plug-in/API Keys (PAKAI YANG MODE TES DULU buat uji coba, awalan
# "xnd_development_..."). Callback Token didapat dari Konfigurasi >
# Callback, dipakai buat verifikasi notifikasi pembayaran asli dari
# Xendit (bukan dari iPaymu - ini pengganti integrasi iPaymu yang
# terkendala IP whitelist):
#   npx wrangler pages secret put XENDIT_SECRET_KEY
#   npx wrangler pages secret put XENDIT_CALLBACK_TOKEN

# OPSIONAL - Cloudflare Turnstile (verifikasi anti-spam/bot di form
# pendaftaran publik /daftar.html). Secret Key didapat dari
# dashboard Cloudflare > Turnstile > widget yang dibuat:
#   npx wrangler pages secret put TURNSTILE_SECRET_KEY